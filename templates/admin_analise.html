{% extends "admin_base.html" %}
{% block title %}Análise de Componentes{% endblock %}

{% block content %}
<div class="container ows-mt-4">
    <h2 class="mb-4">Análise e Balanceamento de Componentes</h2>

    <!-- Controles -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <div class="row">
                <div class="col-md-3">
                    <label for="selectCategoria" class="form-label fw-bold">Categoria</label>
                    <select id="selectCategoria" class="form-select">
                        <option value="motor">Motor</option>
                        <option value="pneu">Pneu</option>
                        <option value="cambio">Câmbio</option>
                        <option value="suspensao">Suspensão</option>
                        <option value="combustivel">Combustível</option>
                        <option value="freio">Freio</option>
                        <option value="engenheiro">Engenheiro</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="selectF1" class="form-label fw-bold">Fornecedor Principal</label>
                    <select id="selectF1" class="form-select"></select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" id="checkComparar">
                        <label class="form-check-label fw-bold" for="checkComparar">
                            Comparar
                        </label>
                    </div>
                </div>
                <div class="col-md-4" id="divF2" style="display: none;">
                    <label for="selectF2" class="form-label fw-bold">Fornecedor Secundário</label>
                    <select id="selectF2" class="form-select"></select>
                </div>
            </div>
        </div>
    </div>

    <!-- Estatísticas Globais -->
    <div class="row mb-4" id="statsContainer">
        <!-- Preenchido via JS -->
    </div>

    <!-- Gráfico -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-dark text-white fw-bold">Visualização de Curvas (Modelos 50-900)</div>
        <div class="card-body">
            <canvas id="graficoAnalise" width="400" height="150"></canvas>
        </div>
    </div>

    <!-- Tabela de Dados -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-dark text-white fw-bold">Tabela de Dados Efetivos</div>
        <div class="card-body table-responsive">
            <table class="table table-striped table-hover text-center align-middle" id="tabelaAnalise">
                <thead class="table-dark" id="tabelaHead"></thead>
                <tbody id="tabelaBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const categoriasData = {{ categorias | tojson }};
    const selectCategoria = document.getElementById('selectCategoria');
    const selectF1 = document.getElementById('selectF1');
    const selectF2 = document.getElementById('selectF2');
    const checkComparar = document.getElementById('checkComparar');
    const divF2 = document.getElementById('divF2');
    
    let chartInstance = null;

    // Mapa de cores fiéis ao solicitado no prompt
    const colorMap = {
        "Potência": "#36A2EB",       // Azul
        "Consumo": "#FF6384",        // Vermelho
        "Durabilidade": "#4BC0C0",   // Verde
        "Performance": "#FFCE56",    // Amarelo
        "Desgaste": "#FF6384",       // Vermelho
        "Eficiência Base": "#36A2EB",
        "Bônus de Potência": "#4BC0C0",
        "Performance Base": "#9966FF"
    };

    function popularDropdowns() {
        const cat = selectCategoria.value;
        const fornecedores = categoriasData[cat] || [];
        
        let options = '';
        fornecedores.forEach(f => {
            options += `<option value="${f.id}">${f.nome} (Nível ${f.nivel})</option>`;
        });
        
        selectF1.innerHTML = options;
        selectF2.innerHTML = options;

        // Tentar deixar o F2 como o segundo item para facilitar a comparação imediata
        if (fornecedores.length > 1) {
            selectF2.selectedIndex = 1;
        }

        buscarDados();
    }

    function buscarDados() {
        const cat = selectCategoria.value;
        const id1 = selectF1.value;
        let url = `/admin/analise/api/dados?categoria=${cat}&id1=${id1}`;
        
        if (checkComparar.checked && selectF2.value) {
            url += `&id2=${selectF2.value}`;
        }

        fetch(url)
            .then(res => res.json())
            .then(data => {
                if (data.erro) {
                    alert(data.erro);
                    return;
                }
                renderizarEstatisticas(data.estatisticas);
                renderizarGrafico(data);
                renderizarTabela(data);
            });
    }

    function renderizarEstatisticas(stats) {
        const container = document.getElementById('statsContainer');
        let html = '';
        Object.entries(stats).forEach(([chave, valor]) => {
            html += `
            <div class="col-md">
                <div class="card text-center bg-light h-100 shadow-sm border-0">
                    <div class="card-body p-3">
                        <small class="text-muted d-block fw-bold text-uppercase">${chave}</small>
                        <span class="fs-6 fw-bold text-primary">${valor}</span>
                    </div>
                </div>
            </div>`;
        });
        container.innerHTML = html;
    }

    function renderizarGrafico(data) {
        const ctx = document.getElementById('graficoAnalise').getContext('2d');
        if (chartInstance) {
            chartInstance.destroy();
        }

        const datasets = [];
        const f1 = data.fornecedor1;
        const f2 = data.fornecedor2;

        if (f1) {
            Object.keys(f1.curvas).forEach(metrica => {
                datasets.push({
                    label: `${f1.nome} - ${metrica}`,
                    data: f1.curvas[metrica],
                    borderColor: colorMap[metrica] || '#000',
                    backgroundColor: colorMap[metrica] || '#000',
                    fill: false,
                    tension: 0.2,
                    borderWidth: 2
                });
            });
        }

        if (f2) {
            Object.keys(f2.curvas).forEach(metrica => {
                datasets.push({
                    label: `${f2.nome} - ${metrica} (Comparação)`,
                    data: f2.curvas[metrica],
                    borderColor: colorMap[metrica] || '#000',
                    backgroundColor: colorMap[metrica] || '#000',
                    borderDash: [5, 5],
                    fill: false,
                    tension: 0.2,
                    borderWidth: 2
                });
            });
        }

        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.modelos,
                datasets: datasets
            },
            options: {
                responsive: true,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                plugins: {
                    tooltip: {
                        enabled: true
                    }
                },
                scales: {
                    x: {
                        title: { display: true, text: 'Modelo Escolhido', font: {weight: 'bold'} }
                    }
                }
            }
        });
    }

    function renderizarTabela(data) {
        const thead = document.getElementById('tabelaHead');
        const tbody = document.getElementById('tabelaBody');
        const f1 = data.fornecedor1;
        const f2 = data.fornecedor2;

        if (!f1) return;

        // Cabeçalho Dinâmico
        let theadHTML = `<tr><th>Modelo</th>`;
        Object.keys(f1.curvas).forEach(metrica => {
            theadHTML += `<th><span class="text-primary">${f1.nome}</span><br><small>${metrica}</small></th>`;
        });
        if (f2) {
            Object.keys(f2.curvas).forEach(metrica => {
                theadHTML += `<th><span class="text-danger">${f2.nome}</span><br><small>${metrica}</small></th>`;
            });
        }
        theadHTML += `</tr>`;
        thead.innerHTML = theadHTML;

        // Corpo Dinâmico
        let tbodyHTML = '';
        data.modelos.forEach((modelo, idx) => {
            tbodyHTML += `<tr><td class="fw-bold bg-light">${modelo}</td>`;
            
            Object.keys(f1.curvas).forEach(metrica => {
                tbodyHTML += `<td>${f1.curvas[metrica][idx]}</td>`;
            });

            if (f2) {
                Object.keys(f2.curvas).forEach(metrica => {
                    tbodyHTML += `<td>${f2.curvas[metrica][idx]}</td>`;
                });
            }
            tbodyHTML += `</tr>`;
        });
        tbody.innerHTML = tbodyHTML;
    }

    // Listeners
    selectCategoria.addEventListener('change', popularDropdowns);
    selectF1.addEventListener('change', buscarDados);
    selectF2.addEventListener('change', buscarDados);
    checkComparar.addEventListener('change', () => {
        divF2.style.display = checkComparar.checked ? 'block' : 'none';
        buscarDados();
    });

    // Init
    popularDropdowns();

</script>
{% endblock %}
